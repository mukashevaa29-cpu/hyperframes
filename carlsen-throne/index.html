    <style>
      :root {
        --ground: #05070f;
        --ink: #ffffff;
        --gold: #ffc83d;
        --red: #ff5050;
        --blue: #4fb0ff;
        --orange: #ff9a3c;
        --green: #8fe35a;
        --navy: #0a1430;
        --font-display: "Nunito", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
        color: var(--ink);
      }

      /* ---- shared scene vocabulary (scenes are mounted into this page) ---- */
      .cam {
        position: absolute;
        inset: -6%;
        will-change: transform;
      }
      .plate {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .vig {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 85% 60% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 22%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.55) 100%);
      }
      .band {
        position: absolute;
        left: 120px;
        right: 192px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .chip {
        display: inline-block;
        padding: 10px 22px 12px;
        border-radius: 12px;
        background: var(--gold);
        color: #16130a;
        font-weight: 900;
        font-size: 36px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
      }
      .chip.dark {
        background: rgba(10, 14, 30, 0.86);
        color: #fff;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.12);
      }
      .chip.red {
        background: var(--red);
        color: #fff;
      }
      .chip.blue {
        background: var(--blue);
        color: #06122a;
      }
      .chip.orange {
        background: var(--orange);
        color: #1d0e00;
      }
      .hero {
        -webkit-text-stroke: 8px rgba(0, 0, 0, 0.55);
        paint-order: stroke fill;
        font-weight: 900;
        line-height: 0.92;
        color: var(--gold);
        letter-spacing: -0.01em;
        text-shadow:
          0 8px 0 rgba(0, 0, 0, 0.45),
          0 0 40px rgba(0, 0, 0, 0.35);
      }
      .sub {
        margin-top: 14px;
        font-weight: 900;
        font-size: 40px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.5);
      }
      .avatar {
        border-radius: 50%;
        overflow: hidden;
        background: #e9edf5;
        box-shadow: 0 12px 0 rgba(0, 0, 0, 0.35);
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .ring-blue {
        border: 10px solid var(--blue);
      }
      .ring-orange {
        border: 10px solid var(--orange);
      }
    </style>
