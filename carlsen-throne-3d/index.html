<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="lib/three.min.js"></script>
    <style>
      :root {
        --ground: #05070f;
        --ink: #ffffff;
        --gold: #ffc83d;
        --red: #ff5050;
        --blue: #4fb0ff;
        --orange: #ff9a3c;
        --green: #8fe35a;
        --navy: #0a1430;
        --font-display: "Nunito", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
        color: var(--ink);
      }

      /* ---- shared scene vocabulary (scenes are mounted into this page) ---- */
      .cam {
        position: absolute;
        inset: -6%;
        will-change: transform;
      }
      .plate {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .vig {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 85% 60% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 22%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.55) 100%);
      }
      .band {
        position: absolute;
        left: 120px;
        right: 192px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .chip {
        display: inline-block;
        padding: 10px 22px 12px;
        border-radius: 12px;
        background: var(--gold);
        color: #16130a;
        font-weight: 900;
        font-size: 36px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
      }
      .chip.dark {
        background: rgba(10, 14, 30, 0.86);
        color: #fff;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.12);
      }
      .chip.red {
        background: var(--red);
        color: #fff;
      }
      .chip.blue {
        background: var(--blue);
        color: #06122a;
      }
      .chip.orange {
        background: var(--orange);
        color: #1d0e00;
      }
      .hero {
        -webkit-text-stroke: 8px rgba(0, 0, 0, 0.55);
        paint-order: stroke fill;
        font-weight: 900;
        line-height: 0.92;
        color: var(--gold);
        letter-spacing: -0.01em;
        text-shadow:
          0 8px 0 rgba(0, 0, 0, 0.45),
          0 0 40px rgba(0, 0, 0, 0.35);
      }
      .sub {
        margin-top: 14px;
        font-weight: 900;
        font-size: 40px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.5);
      }
      .avatar {
        border-radius: 50%;
        overflow: hidden;
        background: #e9edf5;
        box-shadow: 0 12px 0 rgba(0, 0, 0, 0.35);
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .ring-blue {
        border: 10px solid var(--blue);
      }
      .ring-orange {
        border: 10px solid var(--orange);
      }
    
      .w3d {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #w3d-fg {
        filter: blur(9px);
      }
      #w3d-vig {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 90% 62% at 50% 50%, rgba(0, 0, 0, 0) 62%, rgba(0, 0, 0, 0.28) 100%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.25) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.1" data-width="1080" data-height="1920">
      <!-- the 3D world: lib/world.js draws both canvases from timeline time -->
      <canvas id="w3d-bg" class="clip w3d" data-start="0" data-duration="16.1" data-track-index="0" width="1080" height="1920" style="z-index: 1"></canvas>
      <canvas id="w3d-fg" class="clip w3d" data-start="0" data-duration="16.1" data-track-index="0" width="1080" height="1920" style="z-index: 2"></canvas>
      <div id="w3d-vig" class="clip" data-start="0" data-duration="16.1" data-track-index="0" style="z-index: 3"></div>

      <div id="overlays" data-composition-id="overlays" data-composition-src="compositions/overlays.html" data-start="0" data-duration="16.1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="16.1" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 20"></div>

      <audio id="vo" class="clip" src="assets/vo/vo-107.ogg" data-start="0" data-duration="16.1" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx-hook" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="2" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-roll" class="clip" src="assets/sfx/click-soft.mp3" data-start="1.81" data-duration="0.36" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-days" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.38" data-duration="0.57" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-gap1" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="5.53" data-duration="1.1" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-w1" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.45" data-duration="0.57" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-cal" class="clip" src="assets/sfx/pop.mp3" data-start="6.86" data-duration="0.72" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-days2" class="clip" src="assets/sfx/pop.mp3" data-start="12.2" data-duration="0.72" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-bar1" class="clip" src="assets/sfx/click.mp3" data-start="13.75" data-duration="0.36" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-bar2" class="clip" src="assets/sfx/pop.mp3" data-start="14.95" data-duration="0.72" data-track-index="4" data-volume="0.45"></audio>
    </div>
    <script src="lib/world.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
